name: Server CI

on:
  push:
    paths:
      - "Server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "Server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm install
      - run: npm run typecheck
